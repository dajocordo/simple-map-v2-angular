<div class="container p-4">
  <div class="row">
    <div class="col-12">
      <h1 class="titulo text-center mb-4">Simple Map v2.0</h1>
      <p class="text-center mb-4">Fast ⚡ Powerful 💪🏽 and Simple 🌐</p>
      <div class="d-flex align-items-center justify-content-center p-2">
        <p-image [src]="imgSrc" alt="Simple Map v2.0" class="img-fluid rounded"></p-image>
      </div>
        <div class="d-flex align-items-center justify-content-center p-4">
          <p-button label="  Load Map" icon="pi pi-check" severity="primary" (onClick)="navigateToMap()"></p-button>
        </div>
    </div>
  </div>
</div>
